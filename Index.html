<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlix - Free Streaming App</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-40 bg-gradient-to-b from-black/90 to-transparent px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-red-600 text-2xl md:text-3xl font-extrabold tracking-wider cursor-pointer" onclick="resetView()">STREAMFLIX</h1>
      <div class="hidden md:flex gap-4 text-sm text-gray-300">
        <button onclick="resetView()" class="hover:text-white transition">Home</button>
        <button onclick="showMyList()" class="hover:text-white transition">My List (<span id="listCount">0</span>)</button>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search titles..." 
        oninput="handleSearch(this.value)"
        class="bg-zinc-900/90 border border-zinc-700 text-sm rounded px-3 py-1.5 focus:outline-none focus:border-red-600 w-36 md:w-60"
      />
      <button onclick="showMyList()" class="md:hidden text-xs bg-zinc-800 px-2.5 py-1.5 rounded">My List</button>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header id="heroSection" class="relative h-[65vh] md:h-[75vh] w-full flex items-end pb-16 px-6 md:px-12 bg-cover bg-center" style="background-image: url('https://unsplash.com');">
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-black/30"></div>
    <div class="relative z-10 max-w-xl">
      <span class="text-xs uppercase tracking-widest text-red-500 font-bold">Featured Premiere</span>
      <h2 id="heroTitle" class="text-3xl md:text-5xl font-bold mt-1 mb-3">Big Buck Bunny</h2>
      <p id="heroDesc" class="text-gray-300 text-sm md:text-base mb-5 line-clamp-3">
        A large and lovable rabbit deals with three tiny bullies, led by a flying squirrel, who are determined to squelch his happiness.
      </p>
      <div class="flex gap-3">
        <button onclick="playVideo('aqz-KE-bpKQ', 'Big Buck Bunny')" class="bg-white text-black font-semibold px-6 py-2.5 rounded flex items-center gap-2 hover:bg-gray-200 transition">
          ▶ Play
        </button>
        <button onclick="toggleMyList(1)" id="heroListBtn" class="bg-zinc-700/80 text-white font-semibold px-5 py-2.5 rounded hover:bg-zinc-600 transition">
          + My List
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Rows -->
  <main id="contentContainer" class="px-6 md:px-12 pb-20 -mt-6 relative z-20 space-y-10">
    <!-- Rows are injected here by JavaScript -->
  </main>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitle" class="text-lg font-semibold">Now Playing</h3>
        <button onclick="closeVideo()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>
      <div class="relative w-full pt-[56.25%] bg-black rounded-lg overflow-hidden shadow-2xl border border-zinc-800">
        <iframe id="youtubeFrame" class="absolute inset-0 w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. EDIT YOUR VIDEOS HERE (Add your YouTube Video IDs)
    // ==========================================
    const videos = [
      {
        id: 1,
        title: "Big Buck Bunny",
        category: "Trending Now",
        youtubeId: "aqz-KE-bpKQ",
        thumbnail: "https://unsplash.com",
        description: "A lovable giant rabbit takes on three forest bullies."
      },
      {
        id: 2,
        title: "Sintel (Open Movie)",
        category: "Trending Now",
        youtubeId: "eRsGyueVLvQ",
        thumbnail: "https://unsplash.com",
        description: "A lonely young woman searches for a baby dragon she befriended."
      },
      {
        id: 3,
        title: "Tears of Steel",
        category: "Sci-Fi & Action",
        youtubeId: "R6MlUcmOul8",
        thumbnail: "https://unsplash.com",
        description: "Warriors and scientists gather in Amsterdam to save the world from robots."
      },
      {
        id: 4,
        title: "Cosmos Laundromat",
        category: "Sci-Fi & Action",
        youtubeId: "Y-rmzh0PI3c",
        thumbnail: "https://unsplash.com",
        description: "On a desolate island, a suicidal sheep meets a quirky stranger offering new lives."
      },
      {
        id: 5,
        title: "Spring (Fantasy Short)",
        category: "Animation",
        youtubeId: "WhWc3b3KhnY",
        thumbnail: "https://unsplash.com",
        description: "A shepherd girl and her dog face ancient spirits to continue the cycle of life."
      },
      {
        id: 6,
        title: "Charge",
        category: "Animation",
        youtubeId: "UXqq0ZvbOnk",
        thumbnail: "https://unsplash.com",
        description: "An impoverished man breaks into a heavily guarded battery factory."
      }
    ];

    // Load saved "My List" from browser storage
    let myList = JSON.parse(localStorage.getItem('streamflix_mylist')) || [];

    function updateListCount() {
      document.getElementById('listCount').innerText = myList.length;
    }

    function toggleMyList(id) {
      if (myList.includes(id)) {
        myList = myList.filter(item => item !== id);
      } else {
        myList.push(id);
      }
      localStorage.setItem('streamflix_mylist', JSON.stringify(myList));
      updateListCount();
      renderHome();
    }

    function createCardHTML(video) {
      const inList = myList.includes(video.id);
      return `
        <div class="flex-none w-44 md:w-60 group relative rounded-md overflow-hidden bg-zinc-900 transition-transform duration-300 hover:scale-105 cursor-pointer">
          <img src="${video.thumbnail}" alt="${video.title}" onclick="playVideo('${video.youtubeId}', '${video.title.replace(/'/g, "\\'")}')" class="w-full h-28 md:h-36 object-cover" />
          <div class="p-3">
            <h4 class="font-semibold text-sm truncate" onclick="playVideo('${video.youtubeId}', '${video.title.replace(/'/g, "\\'")}')">${video.title}</h4>
            <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">${video.description}</p>
            <div class="flex justify-between items-center mt-2.5">
              <button onclick="playVideo('${video.youtubeId}', '${video.title.replace(/'/g, "\\'")}')" class="text-xs bg-white text-black font-semibold px-2.5 py-1 rounded hover:bg-gray-200">▶ Play</button>
              <button onclick="toggleMyList(${video.id})" class="text-xs border border-zinc-600 px-2 py-1 rounded hover:border-white">
                ${inList ? '✓ Saved' : '+ List'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderHome() {
      document.getElementById('heroSection').classList.remove('hidden');
      const container = document.getElementById('contentContainer');
      const categories = [...new Set(videos.map(v => v.category))];
      
      container.innerHTML = categories.map(category => {
        const catVideos = videos.filter(v => v.category === category);
        return `
          <section>
            <h3 class="text-lg md:text-xl font-bold mb-3">${category}</h3>
            <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
              ${catVideos.map(createCardHTML).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function showMyList() {
      document.getElementById('heroSection').classList.add('hidden');
      const container = document.getElementById('contentContainer');
      const savedVideos = videos.filter(v => myList.includes(v.id));
      
      container.innerHTML = `
        <section class="pt-24">
          <h3 class="text-2xl font-bold mb-4">My List</h3>
          ${savedVideos.length === 0 
            ? '<p class="text-gray-400">Your list is empty. Click "+ List" on any video to save it here.</p>' 
            : `<div class="flex flex-wrap gap-4">${savedVideos.map(createCardHTML).join('')}</div>`
          }
        </section>
      `;
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderHome();
        return;
      }
      document.getElementById('heroSection').classList.add('hidden');
      const filtered = videos.filter(v => 
        v.title.toLowerCase().includes(q) || 
        v.category.toLowerCase().includes(q)
      );
      const container = document.getElementById('contentContainer');
      container.innerHTML = `
        <section class="pt-24">
          <h3 class="text-xl font-bold mb-4">Search Results for "${query}"</h3>
          ${filtered.length === 0
