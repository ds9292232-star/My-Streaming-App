sb_publishable_TqU_sjlKcPYoEIJYxisAHQ_key2OpfN<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlix - Movies & Shows</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-40 bg-gradient-to-b from-black/95 to-transparent px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-red-600 text-2xl md:text-3xl font-extrabold tracking-wider cursor-pointer" onclick="renderHome()">STREAMFLIX</h1>
      <div class="flex gap-4 text-sm text-gray-300">
        <button onclick="renderHome()" class="hover:text-white transition">Home</button>
        <button onclick="filterByType('movie')" class="hover:text-white transition">Movies</button>
        <button onclick="filterByType('show')" class="hover:text-white transition">TV Shows</button>
      </div>
    </div>
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search..." 
      oninput="handleSearch(this.value)"
      class="bg-zinc-900/90 border border-zinc-700 text-sm rounded px-3 py-1.5 focus:outline-none focus:border-red-600 w-32 md:w-56"
    />
  </nav>

  <!-- Hero Banner -->
  <header id="heroSection" class="relative h-[60vh] md:h-[70vh] w-full flex items-end pb-14 px-6 md:px-12 bg-cover bg-center">
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-black/30"></div>
    <div class="relative z-10 max-w-xl" id="heroContent">
      <p class="text-gray-400">Loading catalog...</p>
    </div>
  </header>

  <!-- Main Content Rows -->
  <main id="contentContainer" class="px-6 md:px-12 pb-20 -mt-6 relative z-20 space-y-10"></main>

  <!-- TV Show Details & Episodes Modal -->
  <div id="showModal" class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center p-4 overflow-y-auto">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-3xl w-full p-6 relative my-8">
      <button onclick="closeShowModal()" class="absolute top-4 right-5 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      <div id="showModalHeader" class="mb-5"></div>
      <div class="flex items-center justify-between mb-4">
        <h4 class="font-bold text-lg">Episodes</h4>
        <select id="seasonSelect" onchange="renderEpisodesList()" class="bg-zinc-800 border border-zinc-700 text-sm rounded px-3 py-1.5"></select>
      </div>
      <div id="episodesList" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitle" class="text-lg font-semibold">Now Playing</h3>
        <button onclick="closeVideo()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>
      <div class="relative w-full pt-[56.25%] bg-black rounded-lg overflow-hidden border border-zinc-800">
        <iframe id="playerFrame" class="absolute inset-0 w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // sb_publishable_TqU_sjlKcPYoEIJYxisAHQ_key2OpfN
    // ========================================================
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allItems = [];
    let currentShowEpisodes = [];

    async function loadCatalog() {
      const { data, error } = await db.from('catalog').select('*').order('episode', { ascending: true });
      if (error) {
        document.getElementById('heroContent').innerHTML = `<p class="text-red-500">Database error: Check your Supabase URL and Key.</p>`;
        return;
      }
      allItems = data || [];
      renderHome();
    }

    function getUniqueDisplayItems(items) {
      const seenShows = new Set();
      return items.filter(item => {
        if (item.type === 'show') {
          if (seenShows.has(item.title)) return false;
          seenShows.add(item.title);
        }
        return true;
      });
    }

    function openItem(title, type, videoUrl) {
      if (type === 'movie') {
        playVideo(videoUrl, title);
      } else {
        openShowModal(title);
      }
    }

    function createCardHTML(item) {
      const badge = item.type === 'show' ? '<span class="text-[10px] bg-red-600 px-1.5 py-0.5 rounded uppercase font-bold">Series</span>' : '';
      return `
        <div onclick="openItem('${item.title.replace(/'/g, "\\'")}', '${item.type}', '${item.video_url}')" class="flex-none w-44 md:w-60 rounded-md overflow-hidden bg-zinc-900 transition-transform duration-300 hover:scale-105 cursor-pointer">
          <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-28 md:h-36 object-cover" />
          <div class="p-3">
            <div class="flex items-center justify-between gap-2">
              <h4 class="font-semibold text-sm truncate">${item.title}</h4>
              ${badge}
            </div>
            <p class="text-xs text-gray-400 line-clamp-1 mt-1">${item.description || ''}</p>
          </div>
        </div>
      `;
    }

    function renderHome(filterType = null) {
      const filtered = filterType ? allItems.filter(i => i.type === filterType) : allItems;
      const displayItems = getUniqueDisplayItems(filtered);

      if (displayItems.length > 0) {
        const featured = displayItems[0];
        document.getElementById('heroSection').classList.remove('hidden');
        document.getElementById('heroSection').style.backgroundImage = `url('${featured.thumbnail}')`;
        document.getElementById('heroContent').innerHTML = `
          <span class="text-xs uppercase tracking-widest text-red-500 font-bold">${featured.type === 'show' ? 'Featured Series' : 'Featured Movie'}</span>
          <h2 class="text-3xl md:text-5xl font-bold mt-1 mb-3">${featured.title}</h2>
          <p class="text-gray-300 text-sm md:text-base mb-5 line-clamp-3">${featured.description || ''}</p>
          <button onclick="openItem('${featured.title.replace(/'/g, "\\'")}', '${featured.type}', '${featured.video_url}')" class="bg-white text-black font-semibold px-6 py-2.5 rounded hover:bg-gray-200 transition">
            ${featured.type === 'show' ? '☰ View Episodes' : '▶ Play Now'}
          </button>
        `;
      }

      const categories = [...new Set(displayItems.map(i => i.category))];
      document.getElementById('contentContainer').innerHTML = categories.map(cat => {
        const rowItems = displayItems.filter(i => i.category === cat);
        return `
          <section>
            <h3 class="text-lg md:text-xl font-bold mb-3">${cat}</h3>
            <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
              ${rowItems.map(createCardHTML).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function filterByType(type) {
      renderHome(type);
    }

    function openShowModal(showTitle) {
      currentShowEpisodes = allItems.filter(i => i.type === 'show' && i.title === showTitle);
      const first = currentShowEpisodes[0];
      document.getElementById('showModalHeader').innerHTML = `
        <h3 class="text-2xl font-bold">${first.title}</h3>
        <p class="text-sm text-gray-400 mt-1">${first.description || ''}</p>
      `;

      const seasons = [...new Set(currentShowEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const select = document.getElementById('seasonSelect');
      select.innerHTML = seasons.map(s => `<option value="${s}">Season ${s}</option>`).join('');
      
      renderEpisodesList();
      document.getElementById('showModal').classList.remove('hidden');
      document.getElementById('showModal').classList.add('flex');
    }

    function renderEpisodesList() {
      const selectedSeason = parseInt(document.getElementById('seasonSelect').value);
      const eps = currentShowEpisodes.filter(e => e.season === selectedSeason);
      document.getElementById('episodesList').innerHTML = eps.map(ep => `
        <div onclick="playVideo('${ep.video_url}', '${ep.title.replace(/'/g, "\\'")} - S${ep.season}:E${ep.episode}')" class="flex items-center gap-4 bg-zinc-800/70 hover:bg-zinc-800 p-3 rounded-lg cursor-pointer transition">
          <img src="${ep.thumbnail}" class="w-28 h-16 object-cover rounded flex-none" />
          <div class="flex-1 min-w-0">
            <h5 class="font-semibold text-sm truncate">E${ep.episode}. ${ep.episode_title || 'Episode ' + ep.episode}</h5>
            <p class="text-xs text-gray-400 line-clamp-2 mt-0.5">${ep.description || ''}</p>
          </div>
          <span class="text-white text-lg pr-2">▶</span>
        </div>
      `).join('');
    }

    function closeShowModal() {
      document.getElementById('showModal').classList.add('hidden');
      document.getElementById('showModal').classList.remove('flex');
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      if (!q) return renderHome();
      document.getElementById('heroSection').classList.add('hidden');
      const matches = getUniqueDisplayItems(allItems.filter(i => i.title.toLowerCase().includes(q)));
      document.getElementById('contentContainer').innerHTML = `
        <section class="pt-24">
          <h3 class="text-xl font-bold mb-4">Results for "${query}"</h3>
